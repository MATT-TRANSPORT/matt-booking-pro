name: International Edition regression

on:
  push:
    branches:
      - main
      - feature/international-booking-languages
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: International logic
        run: npm run test:international
      - name: Booking API regression
        run: npm run test:bookings:api
      - name: Company templates API regression
        run: node --test tests/company-templates-api.test.cjs
      - name: Payment webhook regression
        run: npm run test:payments:webhook
      - name: Payment outbox regression
        run: npm run test:payments:outbox
      - name: Customer push contract (isolated, no device delivery)
        run: node --test tests/customer-push.test.cjs
      - name: Invoice download route regression
        run: node --test tests/company-invoice-download.test.cjs tests/booking-document-download.test.cjs
      - name: Saved template render regression
        run: node --test tests/company-templates-render.test.cjs
      - name: Panel read receipt authorization
        run: node --test tests/panel-booking-reads.test.cjs
      - name: Dispatcher history responsive rules (static contract)
        run: node --test tests/dispatcher-history-layout.test.cjs
      - name: Server Component action-cell regression
        run: node --test tests/panel-server-component-render.test.cjs
      - name: Booking flag, compact admin, and driver payment regressions
        run: node --test tests/admin-compact-driver-flags.test.cjs
      - name: Dispatcher responsive cards regression
        run: node --test tests/dispatcher-responsive-cards.test.cjs
      - name: Driver compact header and flight status layout
        run: node --test tests/driver-compact-install-flight-ui.test.cjs
      - name: Full-route detour pricing policy
        run: node --test tests/route-detour-policy.test.cjs
      - name: Driver arrival-first workflow regression
        run: node --test tests/driver-arrival-first.test.cjs
      - name: Driver WhatsApp email regression
        run: node --test tests/driver-whatsapp-email.test.cjs
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Payment method change safety
        run: node --test tests/stripe-method-change.test.cjs tests/company-checkout-concurrency.test.cjs
      - name: Install Chromium for B2B payment UI regression
        run: npx playwright install --with-deps chromium
      - name: Build with local test-only backend
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3201
          NEXT_PUBLIC_SUPABASE_ANON_KEY: matt-local-test-only
          SUPABASE_SERVICE_ROLE_KEY: matt-local-test-only
      - name: B2B payment method UI in four languages and two viewports
        run: npx playwright test -g 'company payment method edit'
      - name: Airport email validation in four languages and two viewports
        run: npx playwright test tests/browser/airport-email.spec.cjs
